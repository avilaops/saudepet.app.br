name: Revisão do Claude
# Todo PR para a main recebe uma revisão de código automática, com comentários
# na linha e um resumo no PR. A revisão comenta; quem decide o merge é o
# `auto-approve.yml` junto com o CI verde do `deploy-production.yml`.
#
# Segredo esperado (Settings → Secrets → Actions), um dos dois:
#   ANTHROPIC_API_KEY        — chave da API da Anthropic
#   CLAUDE_CODE_OAUTH_TOKEN  — token gerado com `claude setup-token`
# Sem nenhum deles o job avisa e termina verde, para não travar o PR.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revisar:
    # Rascunho ainda está mudando; PR de fork não recebe segredo.
    if: >-
      ${{
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Conferir credencial
        id: credencial
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$API_KEY" ] && [ -z "$OAUTH" ]; then
            echo "::warning::Sem ANTHROPIC_API_KEY nem CLAUDE_CODE_OAUTH_TOKEN: revisão pulada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.credencial.outputs.ok == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        if: steps.credencial.outputs.ok == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Revise este pull request do Saúde Pet. A branch do PR já está no
            diretório atual. Leia antes `AGENTS.md` e a seção "Regras
            permanentes" de `docs/ROADMAP.md`: são o contrato do projeto.

            Procure, nesta ordem:
            1. Bugs: lógica errada, caso de borda, erro não tratado, regressão.
            2. Segurança e dados: segredo no código, dado de tutor ou de pet
               exposto, autorização faltando numa rota, entrada sem validação.
            3. Links e rotas: rota nova no React sem entrada em
               `frontend/nginx.saudepet.conf`, link para tela que não existe,
               URL do site montada fora de `urlDoSite`.
            4. Deploy: mudança em `schema.prisma` ou no nginx que exige passo
               manual descrito no AGENTS.md e não está no PR.
            5. Teste faltando para comportamento novo.

            Escreva em português. Comente só o que tem consequência real; não
            comente estilo nem gosto pessoal. Para cada problema, diga o que
            quebra, em que situação, e a correção.

            Use `mcp__github_inline_comment__create_inline_comment` (com
            `confirmed: true`) para cada problema numa linha específica, e
            `gh pr comment` uma vez no fim com o resumo: o que foi revisado e
            os problemas por gravidade, ou que nada bloqueante foi encontrado.
            Poste apenas comentários no GitHub.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
