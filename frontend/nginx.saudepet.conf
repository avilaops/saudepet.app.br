server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # O backend é alcançado pelo nome do container, e o nginx só resolve nome
    # uma vez, no boot, quando o endereço está escrito direto no proxy_pass.
    # Recriar o backend (todo deploy faz isso) troca o IP dele, e o web ficava
    # apontando para o endereço morto: 502 no site inteiro até alguém rodar
    # 'docker compose restart web' à mão. Com o endereço numa variável, o nginx
    # volta a perguntar ao DNS interno do Docker (127.0.0.11) a cada 'valid',
    # e encontra o backend novo sozinho. 'ipv6=off' porque a rede do compose
    # só tem IPv4 e a consulta AAAA só atrasa. A semântica das URLs não muda:
    # proxy_pass sem caminho repassa a URI original, como antes; com caminho,
    # repassa o que está escrito, como antes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3000;

    charset utf-8;
    override_charset on;
    source_charset utf-8;
    charset_types text/xml text/plain text/css application/javascript application/json;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/xml+rss application/rss+xml application/json;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location /api {
        # Fica logo acima do maior teto do multer (25MB do vídeo do chat, em
        # `upload.middleware.js`) mais a folga do envelope multipart. A intenção
        # é que quem estoura o limite receba o JSON de erro do backend em vez do
        # HTML 413 do nginx — se este valor descer abaixo do teto do multer, o
        # nginx corta antes e a tela mostra erro sem mensagem.
        client_max_body_size 26m;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass $backend/api/public/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location = /llms.txt {
        proxy_pass $backend/api/public/llms.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /llms-full.txt {
        proxy_pass $backend/api/public/llms-full.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /rss.xml {
        proxy_pass $backend/api/public/rss.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /feed.xml {
        proxy_pass $backend/api/public/rss.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Metadata e conteúdo essencial das páginas públicas chegam no HTML inicial.
    location = / {
        proxy_pass $backend/api/public/render/page/home;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /faq {
        proxy_pass $backend/api/public/render/page/faq;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /contato {
        proxy_pass $backend/api/public/render/page/contato;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /blog {
        proxy_pass $backend/api/public/render/page/blog;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /privacidade {
        proxy_pass $backend/api/public/render/page/privacidade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(faq|contato|blog|privacidade|mercado)/$ {
        return 301 /$1;
    }

    # Vitrine pública do mercado: índice, loja e produto chegam com metadata e
    # JSON-LD no HTML inicial, como o blog. `/mercado/loja/...` NÃO entra aqui —
    # é o painel do lojista, atrás de login, e cai no SPA como as outras áreas
    # privadas (o `(?!loja(?:/|$))` é o que separa os dois).
    location = /mercado {
        proxy_pass $backend/api/public/render/mercado;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/mercado/(?!loja(?:/|$))([^/]+)/?$ {
        proxy_pass $backend/api/public/render/mercado/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/mercado/(?!loja(?:/|$))([^/]+)/([^/]+)/?$ {
        proxy_pass $backend/api/public/render/mercado/$1/$2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Versão Markdown de cada artigo para leitores e agentes que a preferem.
    location ~ ^/blog/([^/]+)\.md$ {
        proxy_pass $backend/api/public/markdown/blog/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Artigos recebem metadata, JSON-LD e conteúdo no HTML inicial. O React
    # assume a experiência interativa depois do carregamento.
    location ~ ^/blog/([^/]+)/?$ {
        proxy_pass $backend/api/public/render/blog/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # O arquivo de validação do IndexNow só existe quando o nome corresponde à
    # chave configurada no ambiente do backend.
    location ~ "^/([a-f0-9]{32,64})\.txt$" {
        proxy_pass $backend/api/public/indexnow-key/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location ~* (manifest\.json|sw\.js)$ {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|webp|avif|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Áreas operacionais continuam sendo SPA, mas recebem noindex também por
    # cabeçalho HTTP para que a proteção não dependa de JavaScript.
    # `mercado/loja` é o painel do lojista (privado): sem esta entrada, abrir
    # /mercado/loja direto no navegador caía no 404 do nginx desde a primeira
    # fatia — só a navegação interna do app chegava lá.
    # Tutor e veterinário são dois aplicativos para quem usa, e vão ser dois
    # aplicativos nas lojas. Quem decide qual deles o celular instala é o
    # manifesto da página aberta na hora, então cada área é servida a partir
    # do seu próprio HTML, gerado no build por `gerar-html-por-area.mjs`.
    # É a mesma aplicação React e os mesmos arquivos de JavaScript e CSS:
    # muda só a linha do manifesto no cabeçalho.
    location ~ ^/veterinario(/|$) {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri /index-vet.html;
        default_type "text/html; charset=utf-8";
    }

    location ~ ^/tutor(/|$) {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri /index-tutor.html;
        default_type "text/html; charset=utf-8";
    }

    # Os manifestos por área nunca podem vir de cache velho: mudar o escopo
    # de um aplicativo já instalado depende de o celular reler o arquivo.
    location ~* ^/manifest-(tutor|vet)\.webmanifest$ {
        default_type application/manifest+json;
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # `parceiro` entrou aqui em 01/09/2026: as quatro telas existiam no
    # App.tsx desde a construção do portal, mas o nginx não conhecia o
    # prefixo, então /parceiro respondia 404 em produção e só a navegação
    # interna do aplicativo chegava lá. É o mesmo buraco que `mercado/loja`
    # teve na primeira fatia do Mercado.
    # `tag`, `pet-tag` (QR code da carteira digital, inclusive etiquetas já
    # impressas) e `f` (link de formulário enviado ao tutor) são páginas que
    # quem está fora do app abre direto pelo link — até 04/10/2026 respondiam
    # 404 porque o prefixo não estava aqui.
    location ~ ^/(admin|formularios|pet-tag|tag|f|parceiro|mercado/loja|onboarding)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri /index.html;
        default_type "text/html; charset=utf-8";
    }

    # Os nomes em português são os que o app usa; os em inglês seguem vindo
    # em e-mails já enviados e em links antigos. `scripts/verificar-rotas.mjs`
    # reprova o build quando uma rota do React não tem entrada aqui.
    location ~ ^/(login|register|cadastrar|verify-email|verificar-email|forgot-password|esqueci-senha|reset-password|redefinir-senha|dev|dev/selecionar-papel|app)/?$ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri /index.html;
        default_type "text/html; charset=utf-8";
    }

    # URLs desconhecidas deixam de devolver a home com HTTP 200 (soft 404).
    location / {
        try_files $uri $uri/ =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        default_type "text/html; charset=utf-8";
    }
}
