services:
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - transcricao
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # `./backend/src` NÃO é montado de propósito. Desde que o backend compila
      # TypeScript, o que roda é `dist`, assado na imagem — montar o código-fonte
      # do host por cima daria a impressão de que editar arquivo no servidor e
      # reiniciar aplica alguma coisa. Não aplica: deploy exige `up -d --build`.
      - ./backend/prisma:/app/prisma
      - ./frontend/dist:/usr/share/nginx/html
      - uploads-data:/app/uploads

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      # A configuração do nginx era assada na imagem: mudar o arquivo no repo
      # e reiniciar o container NÃO aplicava nada — foi assim que o limite de
      # 26 MB para vídeo ficou invisível num deploy, com o nginx ainda
      # recusando o upload em 6 MB. Montada, ela acompanha o repo.
      - ./frontend/nginx.saudepet.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3005:80"

  # Transcrição de voz (ditar prontuário), faster-whisper local — sem custo
  # por minuto e o áudio nunca sai deste servidor. Só o backend fala com ele
  # (nome de serviço na rede interna do compose); não expõe porta ao host.
  transcricao:
    build: ./transcricao-service
    restart: unless-stopped
    volumes:
      # Cache dos modelos baixados: sem isso, `docker compose up --build`
      # rebaixa o modelo do zero a cada deploy.
      - transcricao-modelos:/home/transcricao/.cache

volumes:
  uploads-data:
  transcricao-modelos:
